<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Himakshi Mishra — Software Developer and AI Enthusiast</title>
  <desc id="desc">A navy, indigo, purple and cyan GitHub profile banner with animated shooting stars, subtle constellations and technology-inspired details.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071536"/>
      <stop offset="38%" stop-color="#17256D"/>
      <stop offset="70%" stop-color="#34206D"/>
      <stop offset="100%" stop-color="#063B67"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2DD4FF" stop-opacity=".24"/>
      <stop offset="100%" stop-color="#2DD4FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0"/>
      <stop offset="65%" stop-color="#A78BFA" stop-opacity=".65"/>
      <stop offset="100%" stop-color="#67E8F9"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="52%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#E879F9"/>
    </linearGradient>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="starGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#9BB7FF" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>
  <ellipse cx="150" cy="15" rx="320" ry="190" fill="url(#glow)"/>
  <ellipse cx="1080" cy="250" rx="360" ry="240" fill="url(#glow)"/>

  <!-- Quiet star field -->
  <g fill="#E0F2FE">
    <circle cx="62" cy="54" r="1.4" opacity=".8"/><circle cx="119" cy="113" r="1" opacity=".65"/>
    <circle cx="178" cy="38" r="1.3" opacity=".7"/><circle cx="246" cy="78" r="1" opacity=".6"/>
    <circle cx="334" cy="35" r="1.5" opacity=".8"/><circle cx="402" cy="85" r="1" opacity=".6"/>
    <circle cx="492" cy="43" r="1.2" opacity=".7"/><circle cx="556" cy="105" r="1" opacity=".6"/>
    <circle cx="651" cy="40" r="1.4" opacity=".7"/><circle cx="733" cy="83" r="1" opacity=".65"/>
    <circle cx="828" cy="39" r="1.3" opacity=".7"/><circle cx="901" cy="95" r="1" opacity=".65"/>
    <circle cx="1008" cy="42" r="1.5" opacity=".8"/><circle cx="1102" cy="86" r="1" opacity=".6"/>
    <circle cx="1150" cy="48" r="1.4" opacity=".7"/><circle cx="1053" cy="145" r="1.2" opacity=".6"/>
    <circle cx="952" cy="238" r="1" opacity=".6"/><circle cx="820" cy="265" r="1.4" opacity=".7"/>
    <circle cx="695" cy="235" r="1" opacity=".6"/><circle cx="540" cy="268" r="1.3" opacity=".65"/>
    <circle cx="380" cy="230" r="1" opacity=".6"/><circle cx="242" cy="267" r="1.4" opacity=".7"/>
    <circle cx="95" cy="223" r="1" opacity=".6"/><circle cx="1144" cy="255" r="1.2" opacity=".7"/>
  </g>

  <!-- Constellation lines -->
  <g fill="none" stroke="#67E8F9" stroke-width="1" stroke-opacity=".26">
    <path d="M70 78 L112 48 L153 66 L190 35"/>
    <path d="M980 85 L1022 58 L1060 79 L1108 47 L1148 68"/>
    <path d="M1000 229 L1040 205 L1084 226 L1128 198 L1163 220"/>
  </g>
  <g fill="#67E8F9" opacity=".7">
    <circle cx="70" cy="78" r="2"/><circle cx="112" cy="48" r="2"/><circle cx="153" cy="66" r="2"/><circle cx="190" cy="35" r="2"/>
    <circle cx="980" cy="85" r="2"/><circle cx="1022" cy="58" r="2"/><circle cx="1060" cy="79" r="2"/><circle cx="1108" cy="47" r="2"/><circle cx="1148" cy="68" r="2"/>
    <circle cx="1000" cy="229" r="2"/><circle cx="1040" cy="205" r="2"/><circle cx="1084" cy="226" r="2"/><circle cx="1128" cy="198" r="2"/><circle cx="1163" cy="220" r="2"/>
  </g>

  <!-- Animated shooting stars -->
  <g>
    <g opacity="0" filter="url(#starGlow)">
      <path d="M-90 0 L-8 0" stroke="url(#trail)" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="2.6" fill="#FFFFFF"/>
      <animateMotion path="M 120 -35 L 440 125" dur="4.8s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.72;1" dur="4.8s" begin="0s" repeatCount="indefinite"/>
    </g>
    <g opacity="0" filter="url(#starGlow)">
      <path d="M-75 0 L-5 0" stroke="url(#trail)" stroke-width="2" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="2.2" fill="#FFFFFF"/>
      <animateMotion path="M 790 -25 L 1030 100" dur="5.6s" begin="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.7;1" dur="5.6s" begin="1.6s" repeatCount="indefinite"/>
    </g>
    <g opacity="0" filter="url(#starGlow)">
      <path d="M-62 0 L-4 0" stroke="url(#trail)" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="2" fill="#FFFFFF"/>
      <animateMotion path="M 540 145 L 740 245" dur="5.2s" begin="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.68;1" dur="5.2s" begin="3.2s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Small code/tech accents -->
  <g font-family="JetBrains Mono, Consolas, monospace" fill="#A5F3FC" opacity=".7">
    <text x="58" y="150" font-size="17">&lt;/&gt;</text>
    <text x="1040" y="155" font-size="15">{ }</text>
    <text x="1090" y="177" font-size="12" fill="#C4B5FD">0101 1010</text>
  </g>
  <g fill="none" stroke="url(#accent)" stroke-width="1.6" opacity=".75">
    <path d="M52 174 H105 V187 H137"/>
    <path d="M1060 188 H1102 V175 H1144"/>
    <circle cx="137" cy="187" r="3" fill="#22D3EE" stroke="none"/>
    <circle cx="1060" cy="188" r="3" fill="#C084FC" stroke="none"/>
  </g>

  <!-- Main text -->
  <text x="600" y="119" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="43" font-weight="750" letter-spacing="2.4" fill="#FFFFFF">HIMAKSHI <tspan fill="#22D3EE">MISHRA</tspan></text>
  <rect x="420" y="140" width="360" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="600" y="174" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="2.1" fill="#F1F5F9">SOFTWARE DEVELOPER  |  AI ENTHUSIAST</text>
  <text x="600" y="207" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="13" letter-spacing=".5" fill="#67E8F9">Building useful software • Learning continuously</text>

  <!-- Bottom flowing neon lines -->
  <path d="M0 260 C150 225 235 292 385 261 S635 232 760 267 S1030 286 1200 244" fill="none" stroke="#2563EB" stroke-width="1.2" opacity=".7"/>
  <path d="M0 271 C150 236 235 303 385 272 S635 243 760 278 S1030 297 1200 255" fill="none" stroke="#22D3EE" stroke-width="1.2" opacity=".8"/>
  <path d="M0 282 C150 247 235 314 385 283 S635 254 760 289 S1030 308 1200 266" fill="none" stroke="#C084FC" stroke-width="1" opacity=".65"/>
  <g filter="url(#starGlow)">
    <circle cx="385" cy="261" r="2.2" fill="#67E8F9"><animate attributeName="opacity" values=".4;1;.4" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="278" r="2.2" fill="#C084FC"><animate attributeName="opacity" values="1;.4;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="1030" cy="286" r="2.2" fill="#67E8F9"><animate attributeName="opacity" values=".3;1;.3" dur="1.8s" repeatCount="indefinite"/></circle>
  </g>
</svg>
